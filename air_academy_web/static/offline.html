<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0E15">
  <title>Offline · Open Air Tech Space</title>
  <style>
    :root{--bg:#0D0E15;--cyan:#00F0FF;--purple:#8A2BE2;--tx:#E8ECF5;--mut:#8A93AD;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;color:var(--tx);
      font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:radial-gradient(60% 45% at 92% -5%,rgba(138,43,226,.30),transparent),radial-gradient(45% 40% at -5% 28%,rgba(0,240,255,.15),transparent),var(--bg);
      padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    main{max-width:420px}
    svg{width:72px;height:72px;filter:drop-shadow(0 0 14px var(--cyan))}
    h1{margin:.5em 0 .2em;font-size:clamp(24px,7vw,30px);letter-spacing:.5px}
    p{margin:0 0 1.4em;color:var(--mut)}
    button{border:0;border-radius:16px;padding:14px 28px;font:700 15px system-ui,sans-serif;letter-spacing:1px;color:#04121a;cursor:pointer;
      background:linear-gradient(90deg,var(--cyan),#5b8cff)}
    button:active{transform:scale(.97)}
    button:focus-visible{outline:2px solid #fff;outline-offset:3px}
    small{display:block;margin-top:1.6em;color:var(--mut);font-size:13px}
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 2l12 7v14l-12 7L4 23V9z" stroke="#00F0FF" stroke-width="1.6" fill="rgba(0,240,255,.10)"/>
      <path d="M9.5 21a6.5 6.5 0 0 1 13 0M7 21h18M16 9.5v2.5M9.5 12.5l1.8 1.8M22.5 12.5l-1.8 1.8" stroke="#fff" stroke-width="1.8"/>
    </svg>
    <h1>You're offline</h1>
    <p>Air Academy needs an internet connection to load your courses and keep your progress safe. Check your data or Wi-Fi, then try again.</p>
    <button id="retry" type="button">TRY AGAIN</button>
    <small>We'll reload by ourselves as soon as you're back online.</small>
  </main>
  <script>
    function go() { location.href = "/"; }
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
  </script>
</body>
</html>
